name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version constant
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Strip 'v' prefix if present for the constant
          VERSION_CLEAN=$(echo $VERSION | sed 's/^v//')
          sed -i "s/const Version = \".*\"/const Version = \"$VERSION_CLEAN\"/" updater.go

      - name: Commit and push changes
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Add 'v' prefix if not present for the tag
          TAG_VERSION=$(echo $VERSION | sed 's/^v*\(.*\)/v\1/')
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add updater.go
          git commit -m "chore: bump version to $TAG_VERSION"
          git push origin main

      - name: Create Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG_VERSION=$(echo $VERSION | sed 's/^v*\(.*\)/v\1/')
          
          git tag $TAG_VERSION
          git push origin $TAG_VERSION
          
          gh release create $TAG_VERSION --generate-notes
